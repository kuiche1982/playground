<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Embryo 架构图</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0d1117; color: #e6edf3; padding: 20px; }
  h1 { text-align: center; color: #58a6ff; }
  .container { max-width: 1100px; margin: 0 auto; }
  svg { width: 100%; height: auto; }
  .legend { display: flex; justify-content: center; gap: 24px; margin-top: 20px; font-size: 13px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 3px; }
</style>
</head>
<body>
<h1>Embryo 发育式认知架构</h1>
<div class="container">
<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- L0: 身体/环境 -->
  <rect x="350" y="20" width="300" height="50" rx="8" fill="#2d4059" stroke="#58a6ff" stroke-width="2"/>
  <text x="500" y="50" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">L0 身体/环境 (World)</text>

  <!-- 感官输入箭头 -->
  <line x1="400" y1="70" x2="200" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="90" fill="#8b949e" font-size="11">视觉输入</text>

  <line x1="500" y1="70" x2="500" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="95" fill="#8b949e" font-size="11">气味输入</text>

  <line x1="600" y1="70" x2="800" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="90" fill="#8b949e" font-size="11">语言输入</text>

  <!-- L1: 先天反射（气味趋性） -->
  <rect x="400" y="120" width="200" height="50" rx="8" fill="#0f3460" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="500" y="142" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">L1 先天反射</text>
  <text x="500" y="160" text-anchor="middle" fill="#8b949e" font-size="11">气味趋性</text>

  <!-- L2: KC稀疏编码 -->
  <rect x="100" y="120" width="200" height="50" rx="8" fill="#0f3460" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="200" y="142" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">L2 感觉编码</text>
  <text x="200" y="160" text-anchor="middle" fill="#8b949e" font-size="11">KC稀疏投影 (500维, 5%活跃)</text>

  <!-- L6: 语言通道 -->
  <rect x="700" y="120" width="200" height="50" rx="8" fill="#0f3460" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="800" y="142" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">L6 语言通道</text>
  <text x="800" y="160" text-anchor="middle" fill="#8b949e" font-size="11">4词输入 (上/下/左/右)</text>

  <!-- L3: 蘑菇体 -->
  <rect x="100" y="220" width="200" height="60" rx="8" fill="#16213e" stroke="#f85149" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">L3 蘑菇体</text>
  <text x="200" y="265" text-anchor="middle" fill="#8b949e" font-size="11">Hebbian学习 + 多巴胺调制</text>

  <!-- L2 → L3 箭头 -->
  <line x1="200" y1="170" x2="200" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L4: 海马体 -->
  <rect x="380" y="220" width="200" height="60" rx="8" fill="#533483" stroke="#bc8cff" stroke-width="2"/>
  <text x="480" y="245" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">L4 海马体</text>
  <text x="480" y="265" text-anchor="middle" fill="#d2a8ff" font-size="11">空间记忆地图</text>

  <!-- L5: 前向模型 -->
  <rect x="660" y="220" width="200" height="60" rx="8" fill="#16213e" stroke="#f85149" stroke-width="2"/>
  <text x="760" y="245" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">L5 前向模型</text>
  <text x="760" y="265" text-anchor="middle" fill="#8b949e" font-size="11">内部模拟/预测</text>

  <!-- L3 → L4 箭头（KC激活→海马记忆） -->
  <line x1="300" y1="250" x2="380" y2="250" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L3 → L5 箭头 -->
  <line x1="300" y1="260" x2="660" y2="260" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L7: 记忆巩固 -->
  <rect x="100" y="330" width="200" height="55" rx="8" fill="#533483" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="200" y="352" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">L7 记忆巩固</text>
  <text x="200" y="370" text-anchor="middle" fill="#d2a8ff" font-size="11">突触固化 + 遗忘</text>

  <!-- L3 ↔ L7 双向箭头 -->
  <line x1="200" y1="280" x2="200" y2="330" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="330" x2="210" y2="280" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L9: 回放 -->
  <rect x="380" y="330" width="200" height="55" rx="8" fill="#533483" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="480" y="352" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">L9 回放</text>
  <text x="480" y="370" text-anchor="middle" fill="#d2a8ff" font-size="11">睡眠重放成功经历</text>

  <!-- L9 → L3 箭头（回放强化） -->
  <path d="M 380 357 Q 250 357 200 300" stroke="#3fb950" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>

  <!-- L10: 前额叶 -->
  <rect x="660" y="330" width="200" height="55" rx="8" fill="#f0a500" stroke="#d29922" stroke-width="2"/>
  <text x="760" y="352" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="bold">L10 前额叶</text>
  <text x="760" y="370" text-anchor="middle" fill="#1a1a2e" font-size="11">任务判断/上下文整合</text>

  <!-- L10 输入箭头 -->
  <line x1="800" y1="170" x2="800" y2="330" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
  <line x1="480" y1="280" x2="660" y2="330" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
  <line x1="760" y1="280" x2="760" y2="330" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>

  <!-- L8: 上下文调制 -->
  <rect x="380" y="430" width="200" height="55" rx="8" fill="#f0a500" stroke="#d29922" stroke-width="2"/>
  <text x="480" y="452" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="bold">L8 上下文调制</text>
  <text x="480" y="470" text-anchor="middle" fill="#1a1a2e" font-size="11">临时调KC兴奋性（不改权重）</text>

  <!-- L10 → L8 箭头 -->
  <line x1="760" y1="385" x2="580" y2="430" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- L8 → L2/L3 反馈箭头（调灵敏度） -->
  <path d="M 380 457 Q 200 457 200 280" stroke="#d29922" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="230" y="420" fill="#d29922" font-size="11">自上而下调灵敏度</text>

  <!-- 决策层 -->
  <rect x="250" y="540" width="500" height="60" rx="10" fill="#e94560" stroke="#ff7b72" stroke-width="2"/>
  <text x="500" y="565" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">决策层（动作选择）</text>
  <text x="500" y="585" text-anchor="middle" fill="#ffd6d6" font-size="12">气味 + 习惯 + 空间记忆 + 前向模拟 + 语言指令 + 噪声 → argmax</text>

  <!-- 各模块 → 决策层 箭头 -->
  <line x1="500" y1="170" x2="400" y2="540" stroke="#8b949e" stroke-width="1" stroke-dasharray="3"/>
  <line x1="200" y1="385" x2="350" y2="540" stroke="#8b949e" stroke-width="1" stroke-dasharray="3"/>
  <line x1="480" y1="385" x2="480" y2="540" stroke="#8b949e" stroke-width="1" stroke-dasharray="3"/>
  <line x1="760" y1="280" x2="650" y2="540" stroke="#8b949e" stroke-width="1" stroke-dasharray="3"/>
  <line x1="800" y1="170" x2="600" y2="540" stroke="#8b949e" stroke-width="1" stroke-dasharray="3"/>

  <!-- 动作输出箭头 -->
  <line x1="500" y1="600" x2="500" y2="660" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="520" y="635" fill="#f85149" font-size="12">动作输出（上/下/左/右）</text>

  <!-- 多巴胺调制箭头 -->
  <rect x="700" y="660" width="200" height="45" rx="8" fill="#3fb950" stroke="#56d364" stroke-width="1.5"/>
  <text x="800" y="680" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">多巴胺信号</text>
  <text x="800" y="697" text-anchor="middle" fill="#fff" font-size="10">吃到食物释放 → 全局广播</text>

  <path d="M 700 682 Q 300 682 200 300" stroke="#3fb950" stroke-width="1.5" fill="none" stroke-dasharray="5" marker-end="url(#arrow-green)"/>
  <text x="400" y="670" fill="#3fb950" font-size="11">多巴胺全局调制</text>

  <!-- 图例说明 -->
  <rect x="50" y="740" width="900" height="140" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="70" y="765" fill="#58a6ff" font-size="13" font-weight="bold">图例说明：</text>
  <text x="70" y="790" fill="#8b949e" font-size="12">实线箭头：前向信号流（感官→处理→决策）</text>
  <text x="70" y="810" fill="#d29922" font-size="12">橙色箭头：自上而下调制（前额叶→感觉皮层，调灵敏度）</text>
  <text x="70" y="830" fill="#3fb950" font-size="12">绿色虚线：多巴胺全局广播 + 回放强化</text>
  <text x="70" y="850" fill="#8b949e" font-size="12">灰色虚线：各模块平行输出到决策层</text>
  <text x="500" y="790" fill="#f85149" font-size="12">红色：学习模块（蘑菇体/前向模型）</text>
  <text x="500" y="810" fill="#bc8cff" font-size="12">紫色：记忆模块（海马体/巩固/回放）</text>
  <text x="500" y="830" fill="#f0a500" font-size="12">黄色：调制模块（前额叶/上下文）</text>
  <text x="500" y="850" fill="#58a6ff" font-size="12">蓝色：输入/反射模块</text>
</svg>
</div>

<div class="legend">
  <div class="legend-item"><div class="dot" style="background:#2d4059"></div>身体环境</div>
  <div class="legend-item"><div class="dot" style="background:#0f3460"></div>感官输入</div>
  <div class="legend-item"><div class="dot" style="background:#16213e"></div>学习处理</div>
  <div class="legend-item"><div class="dot" style="background:#533483"></div>记忆模块</div>
  <div class="legend-item"><div class="dot" style="background:#f0a500"></div>调制模块</div>
  <div class="legend-item"><div class="dot" style="background:#e94560"></div>决策输出</div>
  <div class="legend-item"><div class="dot" style="background:#3fb950"></div>多巴胺</div>
</div>
</body>
</html>
